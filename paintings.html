<!DOCTYPE html>
<html lang="en">

<body>

    <!-- Navigation Section -->

    <!-- Paintings Section -->
    <section id="paintings">
        <h1>Paintings</h1>
        <p></p>
    </section>

   <!-- Image Gallery -->
<section id="image-gallery">
    <div class="gallery">
        <img src="Goldenrod.jpg" alt="Goldenrod" class="zoomable">
        <img src="flowers.jpeg" alt="flowers" class="zoomable">
        <img src="magnolia.jpg" alt="magnolia" class="zoomable">
        <img src="vhs.jpeg" alt="vhs" class="zoomable">
        <img src="zinnia.jpg" alt="zinnia" class="zoomable">
        <img src="fern1.jpeg" alt="fern1" class="zoomable">
        <img src="Painting11.jpeg" alt="Painting 11" class="zoomable">
        <img src="Painting12.jpg" alt="Painting 12" class="zoomable">
        <img src="Painting13.jpeg" alt="Painting 13" class="zoomable">
        <img src="Painting14.jpeg" alt="Painting 14" class="zoomable">
        <img src="Painting1.jpg" alt="Painting 1" class="zoomable">
        <img src="Painting2.jpg" alt="Painting 2" class="zoomable">
        <img src="Painting3.jpg" alt="Painting 3" class="zoomable">
        <img src="Painting4.jpg" alt="Painting 4" class="zoomable">
        <img src="Painting5.JPG" alt="Painting 5" class="zoomable">
        <img src="Painting6.JPG" alt="Painting 6" class="zoomable">
        <img src="Painting7.JPG" alt="Painting 7" class="zoomable">
        <img src="Painting8.JPG" alt="Painting 8" class="zoomable">
        <img src="Painting9.JPG" alt="Painting 9" class="zoomable">
        <img src="Painting10.JPG" alt="Painting 10" class="zoomable">
    </div>
</section>
        <!-- Lightbox container -->
    <div id="lightbox" class="lightbox">
        <img id="lightbox-img" src="" alt="Expanded artwork">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // Open lightbox when any gallery or zoomable image is clicked
        document.querySelectorAll('.gallery img, img.zoomable').forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightboxImg.alt = img.alt;
                lightbox.classList.add('active');
            });
        });

        // Close lightbox when clicking anywhere on the overlay
        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        // Close lightbox with the Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
