<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sculptures - Haley Clancy Inyart</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  
<!-- Header Section -->
    <header>
        <h1>Haley Clancy Inyart</h1>
    </header>

    <!-- Navigation Section -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="exhibitions.html">Exhibitions</a></li>
            <li><a href="paintings.html">Paintings</a></li>
            <li><a href="drawings.html">Drawings</a></li>
            <li><a href="sculptures.html">Sculptures</a></li>
        </ul>
    </nav>

    <!-- Image Gallery -->
    <section id="image-gallery">
        <h2></h2>
        <div class="gallery">
            <img src="Sculpture1.jpg" alt="Sculpture 1">
        </div>
    </section>

    <!-- Lightbox container -->
    <div id="lightbox" class="lightbox">
        <img id="lightbox-img" src="" alt="Expanded artwork">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // Open lightbox when any gallery or zoomable image is clicked
        document.querySelectorAll('.gallery img, img.zoomable').forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightboxImg.alt = img.alt;
                lightbox.classList.add('active');
            });
        });

        // Close lightbox when clicking anywhere on the overlay
        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        // Close lightbox with the Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
